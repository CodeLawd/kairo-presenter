<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ProAutomate NDI Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #root * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      .pa-verse-box,
      .pa-verse {
        min-height: 0;
        min-width: 0;
      }
      .pa-verse,
      .pa-verse-text {
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Populated by the main process via
      // webContents.executeJavaScript('window.__setContent(...)') with the
      // output of renderOverlayHTML() (src/lib/overlay-template.ts).
      function fitVerse() {
        var box = document.querySelector('.pa-verse-box');
        var verse = document.querySelector('.pa-verse');
        if (!box || !verse || box.getAttribute('data-auto-fit') !== 'true') return;
        var text = verse.querySelector('.pa-verse-text') || verse;
        var min = 12;
        var max = parseFloat(box.getAttribute('data-max-font-px') || '240') || 240;
        var lo = min;
        var hi = max;
        var best = min;
        function overflows(px) {
          verse.style.fontSize = px + 'px';
          var h = Math.max(1, Math.min(verse.clientHeight, box.clientHeight));
          var w = Math.max(1, Math.min(verse.clientWidth, box.clientWidth));
          return text.scrollHeight > h + 1 || text.scrollWidth > w + 1;
        }
        if (overflows(min)) {
          verse.style.fontSize = min + 'px';
          return;
        }
        while (lo <= hi) {
          var mid = Math.floor((lo + hi) / 2);
          if (!overflows(mid)) {
            best = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        verse.style.fontSize = best + 'px';
      }
      window.__setContent = function (html) {
        document.getElementById('root').innerHTML = html;
        fitVerse();
      };
      // Color / loop tweaks must not rebuild the slide — that restarts the video.
      window.__patchBackground = function (filter, loop) {
        var bg = document.querySelector('.pa-bg');
        if (bg) {
          if (filter) bg.style.filter = filter;
          else bg.style.removeProperty('filter');
        }
        var video = document.querySelector('.pa-bg video');
        if (video) {
          video.loop = !!loop;
          if (loop && video.ended) video.play();
        }
      };
    </script>
  </body>
</html>

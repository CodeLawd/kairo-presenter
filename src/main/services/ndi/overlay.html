<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kairo NDI Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #root * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
      .pa-verse-box,
      .pa-verse {
        min-height: 0;
        min-width: 0;
      }
      .pa-verse,
      .pa-verse-text {
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Populated by the main process via
      // webContents.executeJavaScript('window.__setContent(...)') with the
      // output of renderOverlayHTML() (src/lib/overlay-template.ts).
      function fitVerse() {
        var box = document.querySelector('.pa-verse-box');
        var verse = document.querySelector('.pa-verse');
        if (!box || !verse || box.getAttribute('data-auto-fit') !== 'true') return;
        var text = verse.querySelector('.pa-verse-text') || verse;
        var min = 12;
        var max = parseFloat(box.getAttribute('data-max-font-px') || '240') || 240;
        var lo = min;
        var hi = max;
        var best = min;
        function overflows(px) {
          verse.style.fontSize = px + 'px';
          var h = Math.max(1, Math.min(verse.clientHeight, box.clientHeight));
          var w = Math.max(1, Math.min(verse.clientWidth, box.clientWidth));
          return text.scrollHeight > h + 1 || text.scrollWidth > w + 1;
        }
        if (overflows(min)) {
          verse.style.fontSize = min + 'px';
          return;
        }
        while (lo <= hi) {
          var mid = Math.floor((lo + hi) / 2);
          if (!overflows(mid)) {
            best = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        verse.style.fontSize = best + 'px';
      }
      window.__setContent = function (html) {
        document.getElementById('root').innerHTML = html;
        fitVerse();
        var videos = document.querySelectorAll('.pa-bg video');
        for (var i = 0; i < videos.length; i++) {
          videos[i].muted = true;
          videos[i].playsInline = true;
          var play = function (video) {
            return function () {
              if (video.dataset.paPaused === '1') return;
              video.play().catch(function () {});
            };
          }(videos[i]);
          if (videos[i].readyState >= 2) play();
          else videos[i].addEventListener('canplay', play, { once: true });
        }
      };
      // Color / loop tweaks must not rebuild the slide — that restarts the video.
      window.__patchBackground = function (filter, loop) {
        var bg = document.querySelector('.pa-bg');
        if (bg) {
          if (filter) bg.style.filter = filter;
          else bg.style.removeProperty('filter');
        }
        var video = document.querySelector('.pa-bg video');
        if (video) {
          video.loop = !!loop;
          if (loop && video.ended && video.dataset.paPaused !== '1') video.play();
        }
      };
      window.__setVideoPaused = function (paused) {
        var video = document.querySelector('.pa-bg video');
        if (!video) return;
        video.dataset.paPaused = paused ? '1' : '';
        if (paused) {
          video.pause();
          return;
        }
        if (video.ended) video.currentTime = 0;
        video.play().catch(function () {});
      };
      // Document decks swap one <img> instead of rebuilding the slide: a full
      // __setContent re-parses the DOM and re-lays out, which is the difference
      // between a clicker feeling instant and feeling laggy. Resolves only once
      // the new pixels are decoded AND painted, so the NDI sender never grabs a
      // frame of the previous page.
      window.__swapDocumentPage = function (src) {
        var image = document.querySelector('.pa-bg img');
        if (!image) return Promise.resolve(false);
        image.src = src;
        var decoded = image.decode ? image.decode() : Promise.resolve();
        // One frame is enough to commit the new pixels; the main process then
        // waits for the offscreen capture that carries them.
        return decoded.catch(function () {}).then(function () {
          return new Promise(function (resolve) {
            requestAnimationFrame(function () { resolve(true); });
          });
        });
      };
      // Decode the page after the current one while the room is still reading
      // this slide, so the next click swaps an image that is already in memory.
      window.__preloadDocumentPage = function (src) {
        var image = new Image();
        image.src = src;
        if (image.decode) image.decode().catch(function () {});
      };
      window.__clearText = function () {
        var boxes = document.querySelectorAll('.pa-verse-box, .pa-reference-box');
        for (var i = 0; i < boxes.length; i++) boxes[i].remove();
      };
      window.__seekVideo = function (seconds) {
        var video = document.querySelector('.pa-bg video');
        if (!video || !isFinite(seconds)) return;
        var duration = video.duration;
        var time = seconds < 0 ? 0 : seconds;
        if (isFinite(duration) && duration > 0 && time > duration) time = duration;
        video.currentTime = time;
      };
    </script>
  </body>
</html>
